mcp_servers:
  youtube_transcript:
    command: /absolute/path/youtube-transcript-mcp/.venv/bin/python
    args: ["-m", "youtube_transcript_mcp", "serve"]
    timeout: 1800
    connect_timeout: 60
    supports_parallel_tool_calls: false
    env:
      YTMCP_WHISPER_MODEL: base
      YTMCP_WHISPER_DEVICE: cpu
      YTMCP_WHISPER_COMPUTE_TYPE: int8
